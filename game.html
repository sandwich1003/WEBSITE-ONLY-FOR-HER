<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fun Tic-Tac-Toe Game!</title>
    <style>
        body { font-family: Arial, sans-serif; background: linear-gradient(to bottom, #ffe6f2, #fff); color: #333; text-align: center; padding: 20px; }
        .container { max-width: 800px; margin: auto; }
        .note { font-style: italic; font-size: 1.2em; margin: 20px 0; }
        footer { margin-top: 40px; font-size: 0.8em; color: #666; }
        .board { display: grid; grid-template-columns: repeat(3, 100px); gap: 5px; margin: 20px auto; justify-content: center; }
        .cell { width: 100px; height: 100px; background: #fff; border: 2px solid #ff69b4; display: flex; align-items: center; justify-content: center; font-size: 2em; font-weight: bold; cursor: pointer; transition: background 0.3s; }
        .cell:hover { background: #ffe6f2; }
        button { padding: 10px 20px; margin: 10px; background: #ff69b4; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 1em; }
        button:hover { background: #d63384; }
        #popup { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 20px; border: 2px solid #ff69b4; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.5); z-index: 1000; }
        #popup button { background: #ff69b4; }
        #status { margin: 10px 0; font-size: 1.2em; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Fun Tic-Tac-Toe Game!</h2>
        <p class="note">Play Tic-Tac-Toe! You're X, I'm O. Try to win by getting 3 in a row. Good luck!</p>
        <div id="status">Your turn!</div>
        <div class="board" id="board">
            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>
        </div>
        <button onclick="resetGame()">Play Again</button>
        <div id="popup">
            <p>Go to another page!</p>
            <button onclick="window.location.href='endpage.html'">Click here</button>
        </div>
        <footer>Made with love and cats.</footer>
    </div>
    <script>
        let board = ['', '', '', '', '', '', '', '', ''];
        let currentPlayer = 'X';
        let gameOver = false;
        const cells = document.querySelectorAll('.cell');
        const status = document.getElementById('status');

        cells.forEach(cell => {
            cell.addEventListener('click', handleClick);
        });

        function handleClick(e) {
            if (gameOver) return;
            const index = e.target.dataset.index;
            if (board[index] !== '') return;
            board[index] = currentPlayer;
            e.target.textContent = currentPlayer;
            if (checkWin('X')) { // Check if player (X) won
                status.textContent = 'You win!';
                document.getElementById('popup').style.display = 'block';
                gameOver = true;
                return;
            }
            if (board.every(cell => cell !== '')) {
                status.textContent = 'It\'s a tie!';
                gameOver = true;
                return;
            }
            currentPlayer = 'O';
            status.textContent = 'My turn...';
            setTimeout(aiMove, 1000); // Delay for realism
        }

        function aiMove() {
            if (gameOver) return;
            let move = getBestMove();
            if (move !== undefined) {
                board[move] = 'O';
                cells[move].textContent = 'O';
                if (checkWin('O')) { // Check if AI (O) won
                    status.textContent = 'I win!';
                    gameOver = true;
                    return;
                }
                if (board.every(cell => cell !== '')) {
                    status.textContent = 'It\'s a tie!';
                    gameOver = true;
                    return;
                }
                currentPlayer = 'X';
                status.textContent = 'Your turn!';
            }
        }

        function checkWin(player) {
            const winPatterns = [
                [0,1,2], [3,4,5], [6,7,8],
                [0,3,6], [1,4,7], [2,5,8],
                [0,4,8], [2,4,6]
            ];
            return winPatterns.some(pattern => {
                return pattern.every(index => board[index] === player);
            });
        }

        function getBestMove() {
            // AI strategy: 1. Win if possible, 2. Block player win, 3. Take center, 4. Take corner, 5. Take edge
            let move = getWinningMove('O'); // Try to win
            if (move !== null) return move;
            move = getWinningMove('X'); // Block player
            if (move !== null) return move;
            const preferred = [4, 0, 2, 6, 8, 1, 3, 5, 7]; // Good positions
            return preferred.find(i => board[i] === '');
        }

        function getWinningMove(player) {
            const winPatterns = [
                [0,1,2], [3,4,5], [6,7,8],
                [0,3,6], [1,4,7], [2,5,8],
                [0,4,8], [2,4,6]
            ];
            for (let pattern of winPatterns) {
                const [a, b, c] = pattern;
                if (board[a] === player && board[b] === player && board[c] === '') return c;
                if (board[a] === player && board[c] === player && board[b] === '') return b;
                if (board[b] === player && board[c] === player && board[a] === '') return a;
            }
            return null;
        }

        function resetGame() {
            board = ['', '', '', '', '', '', '', '', ''];
            cells.forEach(cell => cell.textContent = '');
            currentPlayer = 'X';
            gameOver = false;
            status.textContent = 'Your turn!';
            document.getElementById('popup').style.display = 'none';
        }
    </script>
</body>
</html>
